<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="148mm" viewBox="0 0 210 148" font-family="monospace">
  <title>OPENLAB cardboard theodolite — printable protractor (A5, 1:1)</title>
  <desc>A 180-degree protractor with 1-degree ticks and labels every 10 degrees. Glue to card, pivot a straw sighting tube at the centre mark. A plumb line from the pivot reads elevation.</desc>
