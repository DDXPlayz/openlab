  <g transform="translate(105,120)" stroke="#000" fill="none">
    <path d="M-95 0 A95 95 0 0 1 95 0" stroke-width="0.5"/>
    <path d="M-80 0 A80 80 0 0 1 80 0" stroke-width="0.3"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke-width="0.5"/>
    <circle r="2" stroke-width="0.4"/>
    <!-- ticks: generated for every degree -->
    <g id="ticks" stroke-width="0.25">
      <!-- 1° ticks (short), 5° ticks (medium), 10° ticks (long) -->
      <!-- Generated programmatically: see note -->
    </g>
  </g>
  <g transform="translate(105,120)" stroke="#000" stroke-width="0.25">
    <line x1="-95" y1="0" x2="-88" y2="0" transform="rotate(0)"/>
  </g>
  <!-- ticks and labels -->
  <g transform="translate(105,120)" font-size="3.6" text-anchor="middle" fill="#000">
