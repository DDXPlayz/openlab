    <text x="10" y="16">Pivot a straw at the centre circle. Hang a plumb line (thread + nut) from the same pivot.</text>
    <text x="10" y="22">Elevation angle = |plumb reading − 90|. Height = distance × tan(elevation) + eye height.</text>
