<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="monospace" font-size="4">
  <title>OPENLAB spectrometer cardboard template (A3, 1:1)</title>
  <desc>Cut on solid lines, fold on dashed lines. Slit window on the left panel, grating window on the right panel, camera port on the side wall. Print at 100% on A3 or tile on A4.</desc>
  <rect x="0" y="0" width="420" height="297" fill="#fff"/>
  <!-- net of a 120 x 40 x 40 mm box: four side panels in a row + two end caps -->
  <g fill="none" stroke="#000" stroke-width="0.4">
    <!-- side panels (fold lines dashed) -->
    <rect x="20" y="40" width="120" height="160"/>
    <line x1="20" y1="80" x2="140" y2="80" stroke-dasharray="3 2"/>
    <line x1="20" y1="120" x2="140" y2="120" stroke-dasharray="3 2"/>
    <line x1="20" y1="160" x2="140" y2="160" stroke-dasharray="3 2"/>
    <!-- glue tab -->
    <path d="M20 200 L20 208 L140 208 L140 200" stroke-dasharray="3 2"/>
    <!-- camera port on panel 2 (side wall), 14 mm hole, 30 mm from the grating end -->
    <circle cx="110" cy="100" r="7"/>
    <!-- end caps -->
    <rect x="160" y="40" width="40" height="40"/>
    <rect x="160" y="100" width="40" height="40"/>
    <!-- slit window in cap A: 4 x 12 mm; razor blades glued over it with a 0.2 mm gap -->
    <rect x="178" y="54" width="4" height="12"/>
    <!-- grating window in cap B: 25 x 25 mm -->
    <rect x="167.5" y="107.5" width="25" height="25"/>
    <!-- cap tabs -->
    <g stroke-dasharray="3 2">
      <path d="M160 40 L152 46 L152 74 L160 80"/>
      <path d="M200 40 L208 46 L208 74 L200 80"/>
      <path d="M160 100 L152 106 L152 134 L160 140"/>
      <path d="M200 100 L208 106 L208 134 L200 140"/>
    </g>
    <!-- 100 mm scale check -->
    <line x1="20" y1="230" x2="120" y2="230"/>
    <line x1="20" y1="227" x2="20" y2="233"/><line x1="120" y1="227" x2="120" y2="233"/>
  </g>
  <g fill="#000">
    <text x="20" y="30">OPENLAB / spectrometer-cardboard-template.svg (A3 @ 100%)</text>
    <text x="24" y="60">PANEL 1 (top)</text>
    <text x="24" y="100">PANEL 2 (side) — camera port ⌀14</text>
    <text x="24" y="140">PANEL 3 (bottom)</text>
    <text x="24" y="180">PANEL 4 (side)</text>
    <text x="24" y="206">glue tab</text>
    <text x="160" y="90">CAP A: slit</text>
    <text x="160" y="150">CAP B: grating 25×25</text>
    <text x="20" y="240">100 mm scale check — measure after printing</text>
    <text x="20" y="250">Solid = cut · Dashed = fold · Line the inside with black paper before assembly.</text>
    <text x="20" y="260">Grating sits at 45° to the tube axis: glue it to a small cardboard wedge behind CAP B.</text>
    <text x="20" y="270">License CC BY-SA 4.0 — anantamracing.com/hackathon/openlab/</text>
  </g>
</svg>
