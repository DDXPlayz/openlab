<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" font-family="monospace" font-size="3.5">
  <title>OPENLAB line-following robot — chassis template (A4, 1:1)</title>
  <desc>Cut from 3 mm plywood/acrylic on a laser cutter, or from double-layered corrugated cardboard with a knife. Red = cut. Slots fit TT gear motors (yellow, 1:48) mounted with cable ties; front holes take two TCRT5000 sensor modules 30 mm apart; rear hole is for the ball castor.</desc>
  <rect width="297" height="210" fill="#fff"/>
  <g fill="none" stroke="#f00" stroke-width="0.25">
    <!-- main plate 150 x 100 with rounded corners -->
    <rect x="20" y="30" width="150" height="100" rx="12"/>
    <!-- motor cable-tie slots (two per motor), motors at the rear third, 65 mm wheels -->
    <rect x="35" y="88" width="3" height="10"/><rect x="58" y="88" width="3" height="10"/>
    <rect x="35" y="102" width="3" height="10"/><rect x="58" y="102" width="3" height="10"/>
    <rect x="129" y="88" width="3" height="10"/><rect x="152" y="88" width="3" height="10"/>
    <rect x="129" y="102" width="3" height="10"/><rect x="152" y="102" width="3" height="10"/>
    <!-- castor mounting holes at the front (M3) -->
    <circle cx="87" cy="42" r="1.6"/><circle cx="103" cy="42" r="1.6"/>
    <!-- Arduino Uno mounting holes (measured: 15.24/66.04 x 2.54/50.8 mm pattern) -->
    <circle cx="80" cy="66" r="1.6"/><circle cx="80.5" cy="114.5" r="1.6"/><circle cx="130.8" cy="66" r="1.6"/><circle cx="146.04" cy="94.5" r="1.6"/>
    <!-- sensor holes at the very front, 30 mm apart, M3 -->
    <circle cx="80" cy="35" r="1.6"/><circle cx="110" cy="35" r="1.6"/>
    <!-- battery-holder slots (cable tie) -->
    <rect x="50" y="60" width="3" height="10"/><rect x="50" y="76" width="3" height="10"/>
    <!-- sensor bracket: separate L-piece, bend line dashed -->
    <rect x="190" y="30" width="40" height="30"/>
    <line x1="190" y1="45" x2="230" y2="45" stroke-dasharray="2 1.5"/>
    <circle cx="200" cy="52" r="1.6"/><circle cx="220" cy="52" r="1.6"/>
    <circle cx="200" cy="37" r="1.6"/><circle cx="220" cy="37" r="1.6"/>
    <!-- two wheel spacers (if using bottle-cap wheels) -->
    <circle cx="200" cy="90" r="15"/><circle cx="200" cy="90" r="2.7"/>
    <circle cx="240" cy="90" r="15"/><circle cx="240" cy="90" r="2.7"/>
  </g>
  <g fill="#000">
    <text x="22" y="24">OPENLAB / line-follower-chassis.svg — red = cut · 3 mm ply or acrylic · check the plate is 150 mm wide after printing</text>
    <text x="24" y="60">FRONT: castor + 2× TCRT5000</text>
    <text x="24" y="124">REAR: TT motors (cable-tie slots)</text>
    <text x="190" y="66">sensor bracket (fold)</text>
    <text x="185" y="112">wheel spacers / cap wheels (D-hole 5.4 mm)</text>
    <text x="20" y="150">Assembly: motors face outward, shafts at the plate edge. Mount sensors 10–15 mm above the floor.</text>
    <text x="20" y="156">Cardboard version: cut two copies and glue them cross-grain for stiffness.</text>
    <text x="20" y="200">License CC BY-SA 4.0 — anantamracing.com/hackathon/openlab/</text>
  </g>
</svg>
